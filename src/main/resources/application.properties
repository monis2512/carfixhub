
spring.application.name=shahrukh-auto-care-admin

server.port=${PORT:8080}

# PostgreSQL - Render
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Admin credentials
app.admin.username=${ADMIN_USERNAME:owner}
app.admin.password=${ADMIN_PASSWORD:change-me-now}

# Render / proxy support
server.forward-headers-strategy=framework
