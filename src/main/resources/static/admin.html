<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Car Fix Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .logout-btn {
            border: 1px solid #555;
            background: #222;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #333;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .login-card {
            max-width: 400px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #333;
        }

        .error {
            color: #d93025;
            margin-top: 12px;
            font-size: 14px;
        }

        .dashboard {
            display: none;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-section h2 {
            margin: 0;
        }

        .count {
            background: #111;
            color: white;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        .query-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
            position: relative;
        }

        .query-card.new {
            border-left: 5px solid #111;
        }

        .query-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .query-number {
            font-weight: bold;
            font-size: 17px;
        }

        .new-badge {
            display: inline-block;
            background: #111;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
        }

        .date {
            color: #777;
            font-size: 13px;
            text-align: right;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .detail {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
        }

        .label {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            font-weight: 600;
            word-break: break-word;
        }

        .description {
    margin-top: 15px;
    margin-bottom: 15px;
}

.description .label {
    display: block;
    color: #555;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.description-text {
    background: #fafafa;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 14px;
    color: #333;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
}

        .actions {
            display: flex;
            gap: 10px;
        }

        .call-btn {
            display: inline-block;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .delete-btn {
            background: #fff;
            color: #d93025;
            border: 1px solid #d93025;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #d93025;
            color: white;
        }

        .refresh-text {
            color: #777;
            font-size: 12px;
            margin-top: 10px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #111;
            color: white;
            padding: 14px 18px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
        }

        @media (max-width: 650px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 17px;
            }

            .container {
                margin: 15px auto;
            }

            .top-section {
                align-items: flex-start;
                flex-direction: column;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .query-header {
                flex-direction: column;
            }

            .date {
                text-align: left;
            }

            .actions {
                flex-direction: column;
            }

            .call-btn,
            .delete-btn {
                text-align: center;
                width: 100%;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Car Fix Hub</h1>
    <button id="logoutBtn" class="logout-btn" onclick="logout()">
        Logout
    </button>
</header>

<!-- LOGIN -->
<div id="loginSection" class="login-card">

    <h2>Admin Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit" class="login-btn">
            Login
        </button>

        <button
    type="button"
    class="login-btn"
    onclick="window.location.href='/index.html'"
    style="margin-top: 10px;"
>
    Go to Home Page
        </button>

        <div id="loginError" class="error"></div>

    </form>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

    <div class="container">

        <div class="top-section">

            <div>
                <h2>Customer Enquiries</h2>

                <div class="refresh-text">
                    Automatically checking for new enquiries every 10 seconds.
                </div>
            </div>

            <div id="count" class="count">
                0 Enquiries
            </div>

        </div>

        <div id="queriesContainer"></div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

    let queries = [];
    let lastKnownId = 0;
    let firstLoad = true;


    /*
     * IMPORTANT:
     * Convert database/server UTC time to India Standard Time.
     *
     * India = Asia/Kolkata
     * UTC + 5 hours 30 minutes
     */
    function formatDateTime(dateString) {

    if (!dateString) {
        return "—";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return dateString;
    }

    return date.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });
    }


    /*
     * Escape HTML so customer-entered text
     * cannot inject HTML/JavaScript into admin page.
     */
    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
     * Check whether admin is already logged in.
     */
    async function checkSession() {

        try {

            const response = await fetch("/api/admin/session", {
                credentials: "same-origin"
            });

            if (!response.ok) {
                showLogin();
                return;
            }

            const data = await response.json();

            if (data.authenticated === true) {
                showDashboard();
                await loadQueries();
            } else {
                showLogin();
            }

        } catch (error) {

            console.error("Session check failed:", error);

            showLogin();
        }
    }


    /*
     * Login
     */
    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const loginError =
                document.getElementById("loginError");

            loginError.textContent = "";


            try {

                const response = await fetch("/api/admin/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


                if (!response.ok) {

                    loginError.textContent =
                        "Invalid username or password.";

                    return;
                }


                showDashboard();

                await loadQueries();

            } catch (error) {

                console.error("Login error:", error);

                loginError.textContent =
                    "Unable to connect to server.";

            }

        });


    /*
     * Show login
     */
    function showLogin() {

        document.getElementById("loginSection").style.display = "block";

        document.getElementById("dashboard").style.display = "none";

        document.getElementById("logoutBtn").style.display = "none";
    }


    /*
     * Show dashboard
     */
    function showDashboard() {

        document.getElementById("loginSection").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

        document.getElementById("logoutBtn").style.display = "block";
    }


    /*
     * Logout
     */
    
async function logout() {

    try {
        await fetch("/api/admin/logout", {
            method: "POST",
            credentials: "same-origin"
        });
    } catch (error) {
        console.error("Logout error:", error);
    }

    queries = [];
    lastKnownId = 0;
    firstLoad = true;

    window.location.href = "/index.html";
}

    /*
     * Load enquiries
     */
    async function loadQueries() {

        try {

            const response = await fetch("/api/admin/queries", {

                method: "GET",

                credentials: "same-origin",

                cache: "no-store"

            });


            if (response.status === 401 ||
                response.status === 403) {

                showLogin();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Failed to load enquiries"
                );
            }


            const data = await response.json();


            if (!Array.isArray(data)) {

                console.error(
                    "Unexpected API response:",
                    data
                );

                return;
            }


            /*
             * Check for newly submitted enquiry.
             */
            if (!firstLoad && data.length > 0) {

                const newestId =
                    Math.max(
                        ...data.map(q => Number(q.id) || 0)
                    );


                if (newestId > lastKnownId) {

                    const newItems =
                        data.filter(
                            q => Number(q.id) > lastKnownId
                        );


                    if (newItems.length > 0) {

                        showToast(
                            "New customer enquiry received!"
                        );


                        sendBrowserNotification(
                            "New Customer Enquiry",
                            "A new enquiry has been received."
                        );

                    }

                }

            }


            /*
             * Remember highest enquiry ID.
             */
            if (data.length > 0) {

                lastKnownId =
                    Math.max(
                        ...data.map(
                            q => Number(q.id) || 0
                        )
                    );

            }


            queries = data;

            firstLoad = false;

            renderQueries();

        } catch (error) {

            console.error(
                "Error loading enquiries:",
                error
            );

        }

    }


    /*
     * Render enquiries.
     */
    function renderQueries() {

        const container =
            document.getElementById("queriesContainer");

        const count =
            document.getElementById("count");


        count.textContent =
            `${queries.length} ${
                queries.length === 1
                    ? "Enquiry"
                    : "Enquiries"
            }`;


        if (queries.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No enquiries yet.
                </div>
            `;

            return;
        }


        /*
         * Newest enquiry first.
         */
        const sortedQueries =
            [...queries].sort(
                (a, b) =>
                    Number(b.id || 0) -
                    Number(a.id || 0)
            );


        container.innerHTML =
            sortedQueries.map((q, index) => {

                const isNew =
                    index === 0 &&
                    Number(q.id) === lastKnownId;


                const mobile =
                    escapeHtml(q.mobileNumber);


                const callNumber =
                    encodeURIComponent(
                        q.mobileNumber || ""
                    );


                return `
                    <div class="query-card ${isNew ? "new" : ""}">

                        <div class="query-header">

                            <div class="query-number">

                                Enquiry #${escapeHtml(q.id)}

                                ${
                                    isNew
                                        ? '<span class="new-badge">NEW</span>'
                                        : ''
                                }

                            </div>

                            <div class="date">
                                ${formatDateTime(q.createdAt)}
                            </div>

                        </div>


                        <div class="details">

                            <div class="detail">

                                <span class="label">
                                    Car
                                </span>

                                <span class="value">
                                    ${escapeHtml(q.carModel)}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="label">
                                    Service
                                </span>

                                <span class="value">
                                    ${escapeHtml(q.serviceType)}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="label">
                                    Mobile Number
                                </span>

                                <span class="value">
                                    ${mobile}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="label">
                                    Submitted
                                </span>

                                <span class="value">
                                    ${formatDateTime(q.createdAt)}
                                </span>

                            </div>

                        </div>


                        <div class="description">

    <span class="label">
        Customer Description
    </span>

    <div class="description-text">
        ${escapeHtml(q.description)}
    </div>

</div>


                        ${
                            q.photoName
                                ? `
                                    <div class="description">

                                        <span class="label">
                                            Damage Photo
                                        </span>

                                        ${escapeHtml(q.photoName)}

                                    </div>
                                `
                                : ""
                        }


                        <div class="actions">

                            <a
                                class="call-btn"
                                href="tel:${callNumber}"
                            >
                                📞 Call Customer
                            </a>


                            <button
                                class="delete-btn"
                                onclick="deleteQuery(${Number(q.id)})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

    }


    /*
     * Delete enquiry
     */
    async function deleteQuery(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this enquiry?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/admin/queries/${id}`,
                    {
                        method: "DELETE",
                        credentials: "same-origin"
                    }
                );


            if (response.status === 401 ||
                response.status === 403) {

                showLogin();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );
            }


            queries =
                queries.filter(
                    q => Number(q.id) !== Number(id)
                );


            renderQueries();


            showToast(
                "Enquiry deleted."
            );


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            showToast(
                "Unable to delete enquiry."
            );

        }

    }


    /*
     * Browser notification.
     */
    function sendBrowserNotification(title, message) {

        if (!("Notification" in window)) {
            return;
        }


        if (Notification.permission === "granted") {

            new Notification(title, {
                body: message
            });

        }

    }


    /*
     * Ask for notification permission.
     */
    async function requestNotificationPermission() {

        if (!("Notification" in window)) {
            return;
        }


        if (Notification.permission === "default") {

            try {

                await Notification.requestPermission();

            } catch (error) {

                console.error(
                    "Notification permission error:",
                    error
                );

            }

        }

    }


    /*
     * Toast message.
     */
    function showToast(message) {

        const toast =
            document.getElementById("toast");


        toast.textContent = message;

        toast.style.display = "block";


        setTimeout(() => {

            toast.style.display = "none";

        }, 4000);

    }


    /*
     * Automatically check for new enquiries
     * every 10 seconds.
     */
    setInterval(async function() {

        const dashboard =
            document.getElementById("dashboard");


        if (
            dashboard.style.display !== "none" &&
            dashboard.style.display !== ""
        ) {

            await loadQueries();

        }

    }, 10000);


    /*
     * Start page.
     */
    document.addEventListener(
        "DOMContentLoaded",
        async function() {

            await requestNotificationPermission();

            await checkSession();

        }
    );

</script>

</body>
</html>
