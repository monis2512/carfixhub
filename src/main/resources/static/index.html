/* ================================

================================ */

carBrand.onchange = function () {

    const brand = carBrand.value;

    carModel.innerHTML = "";

    if (!brand) {

        carModel.disabled = true;

        carModel.innerHTML =
            '<option value="">First choose car brand</option>';

        return;
    }

    carModel.disabled = false;

    carModel.innerHTML =
        '<option value="">Choose ' +
        brand +
        ' model</option>';

    const models =
        carModels[brand] || [
            "Other / Different Model"
        ];

    models.forEach(function (model) {

        const option =
            document.createElement("option");

        option.value = model;

        option.textContent = model;

        carModel.appendChild(option);

    });

};

.forEach(function (button) {

    button.onclick = function (e) {

        e.preventDefault();

        document
        .querySelectorAll(".service")
        .forEach(function (item) {

            item.classList.remove("active");

        });

        button.classList.add("active");

        service = button.dataset.s;

});

/*function msg(t, ok) {

    function msg(t, ok) {
    status.textContent = t;
    status.className = "status " + (ok ? "success" : "error");

    status.scrollIntoView({
        behavior: "smooth",
        block: "center"

/* ================================
   SUBMIT
================================ */

send.onclick = async function () {

    const brand =
        carBrand.value;

    const model =
        carModel.value;

    const c =
        brand + " - " + model;

    const m =
        mobile.value.trim();

    const d =
        desc.value.trim();

    const p =
        photo.files[0];


    /* ================================
       VALIDATION
    ================================= */

    if (!brand) {
        return msg(
            "Please select your car brand.",
            false
        );
    }


    if (!model) {
        return msg(
            "Please select your car model.",
            false
        );
    }


    if (!service) {
        return msg(
            "Please select a service.",
            false
        );
    }


    if (!/^[6-9]\d{9}$/.test(m)) {
        return msg(
            "Please enter a valid 10-digit Indian mobile number.",
            false
        );
    }


    if (!d) {
        return msg(
            "Please describe the damage.",
            false
        );
    }


    /* ================================
       PREVENT DOUBLE CLICK
    ================================= */

    send.disabled = true;

    send.textContent = "Sending...";


    try {

        /*
         * Abort the request if it takes too long.
         * This prevents the button getting stuck
         * on "Sending..."
         */

        const controller =
            new AbortController();

        const timeout =
            setTimeout(function () {

                controller.abort();

            }, 60000); // 60 seconds


        const response =
            await fetch(
                "/api/queries",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "same-origin",

                    signal:
                        controller.signal,

                    body: JSON.stringify({

                        carModel:
                            c,

                        serviceType:
                            service,

                        mobileNumber:
                            m,

                        description:
                            d,

                        photoName:
                            p ? p.name : ""

                    })
                }
            );


        clearTimeout(timeout);


        /*
         * Try to read JSON response.
         */

        let data = {};

        try {

            data =
                await response.json();

        } catch (error) {

            data = {};

        }


        /*
         * Server returned an error.
         */

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to submit enquiry. Please try again."
            );

        }


        /*
         * SUCCESS
         */

        alert(
            "Your query has been submitted successfully. You will be contacted soon."
        );


        /* Reset brand */

        carBrand.value = "";


        /* Reset model */

        carModel.innerHTML =
            '<option value="">First choose car brand</option>';

        carModel.disabled = true;


        /* Reset mobile */

        mobile.value = "";


        /* Reset description */

        desc.value = "";

        cnt.textContent = "0";


        /* Reset photo */

        photo.value = "";


        /* Reset service */

        document
        .querySelectorAll(".service")
        .forEach(function (item) {

            item.classList.remove("active");

        });

        service = "";


        /*
         * Clear previous status message.
         */

        status.style.display = "none";


    } catch (error) {

        console.error(
            "Enquiry submission error:",
            error
        );


        /*
         * Special message when request times out.
         */

        if (
            error.name === "AbortError"
        ) {

            msg(
                "The server is taking too long to respond. Please try again.",
                false
            );

        } else {

            msg(
                error.message ||
                "Unable to submit enquiry. Please try again.",
                false
            );

        }

    } finally {

        /*
         * IMPORTANT:
         * Always restore the Send button,
         * even if the request fails.
         */

        send.disabled = false;

        send.textContent =
            "Send Enquiry";

    }

};
