<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Shahrukh Auto Care</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial;
    background:#0b0d10;
    color:#fff
}

.hero{
    padding:55px 20px;
    text-align:center;
    background:
        linear-gradient(#0008,#000d),
        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1400&q=85')
        center/cover
}

.hero h1{
    font-size:clamp(36px,9vw,60px);
    margin:15px 0
}

.hero p{
    color:#ddd;
    line-height:1.6
}

.wrap{
    max-width:680px;
    margin:-30px auto 40px;
    padding:0 12px
}

.card{
    background:#15181d;
    border:1px solid #292e35;
    border-radius:20px;
    padding:22px
}

.field{
    margin:18px 0
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#ddd
}

select,
input,
textarea{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #343a42;
    background:#0f1216;
    color:#fff;
    font-size:15px
}

select:disabled{
    opacity:.55;
    cursor:not-allowed
}

textarea{
    min-height:120px
}

.services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px
}

.service{
    padding:13px;
    border:1px solid #343a42;
    border-radius:11px;
    background:#101318;
    color:#ddd;
    font-weight:bold
}

.service.active{
    background:#fff;
    color:#111
}

.submit{
    width:100%;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#111;
    font-size:16px;
    font-weight:bold
}

.status{
    display:none;
    padding:13px;
    border-radius:11px;
    margin:12px 0
}

.success{
    display:block;
    background:#12351f;
    color:#b8f5ca
}

.error{
    display:block;
    background:#391619;
    color:#ffb9be
}

.contact{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px
}

.contact a{
    padding:13px;
    border:1px solid #333;
    border-radius:11px;
    color:#fff;
    text-decoration:none;
    text-align:center
}

.counter{
    text-align:right;
    color:#777;
    font-size:12px
}

.admin-login{
    position:fixed;
    top:16px;
    right:16px;
    z-index:20;
    text-decoration:none;
    color:#fff;
    background:rgba(20,20,20,.72);
    border:1px solid rgba(255,255,255,.25);
    padding:9px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    backdrop-filter:blur(8px)
}

.admin-login:hover{
    background:#111;
    color:#fff
}

@media(max-width:600px){

    .admin-login{
        top:10px;
        right:10px;
        padding:8px 11px;
        font-size:11px
    }

    .services{
        grid-template-columns:1fr
    }
}
</style>
</head>

    <!-- SERVICE -->
    <div class="field">

        <label>
            Service Required
        </label>

        <div class="services">

            </button>

            <button class="service" data-s="Scratch Repair">
                ✨ Scratch Repair
            </button>

    </div>


    <!-- MOBILE -->
    <div class="field">

        <label for="mobile">
            Mobile Number *
        </label>

        <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="10-digit mobile number"
        >

    </div>


    <!-- DESCRIPTION -->
    <div class="field">

        <label for="desc">
            Describe the damage *
        </label>

        <textarea
            id="desc"
            maxlength="1000"
            placeholder="Example: Front bumper has a dent..."
        ></textarea>

        <div class="counter">
            <span id="cnt">0</span>/1000
        </div>

    </div>


    <!-- PHOTO -->
    <div class="field">

        <label for="photo">
            Damage Photo (Optional)
        </label>

        <input
            id="photo"
            type="file"
            accept="image/*"
        >

    </div>


    <button class="submit" id="send">
        Send Enquiry
    </button>


    <div class="contact">

        <a href="tel:+918979111277">
            📞 Call
        </a>

        <a
            href="https://wa.me/918979111277"
            target="_blank"
        >
            💬 WhatsApp
        </a>

    </div>


    <p style="text-align:center;color:#999;font-size:13px;line-height:1.6">

        Khanalampura, opposite Dr Shamshad,
        Saharanpur - 247001

    </p>

</div>
</div>

/* ================================
   BRAND CHANGE
================================ */

const carBrand =
    document.getElementById("carBrand");

const carModel =
    document.getElementById("carModel");


carBrand.addEventListener("change", function () {

    const brand = this.value;

    carModel.innerHTML = "";

    if (!brand) {

        carModel.disabled = true;

        carModel.innerHTML =
            '<option value="">First choose car brand</option>';

        return;
    }


    carModel.disabled = false;


    const firstOption =
        document.createElement("option");

    firstOption.value = "";

    firstOption.textContent =
        "Choose " + brand + " model";

    carModel.appendChild(firstOption);


    const models =
        carModels[brand] || [
            "Other / Different Model"
        ];


    models.forEach(function (model) {

        const option =
            document.createElement("option");

        option.value = model;

        option.textContent = model;

        carModel.appendChild(option);

    });

});


/* ================================
   SERVICE SELECTION
================================ */

document
    .querySelectorAll(".service")
    .forEach(function (b) {

        b.onclick = function (e) {

            e.preventDefault();

            document
                .querySelectorAll(".service")
                .forEach(function (x) {
                    x.classList.remove("active");
                });

            b.classList.add("active");

            service = b.dataset.s;
        };

    });


/* ================================
   DESCRIPTION COUNTER
================================ */

const desc =
    document.getElementById("desc");

const cnt =
    document.getElementById("cnt");

desc.oninput = function () {

    cnt.textContent =
        desc.value.length;

};


/* ================================
   STATUS MESSAGE
================================ */

function msg(t, ok) {

    const status =
        document.getElementById("status");

    status.textContent = t;

    status.className =
        "status " + (ok ? "success" : "error");

}


/* ================================
   SEND ENQUIRY
================================ */

document
    .getElementById("send")
    .onclick = async function () {

        const brand =
            carBrand.value;

        const model =
            carModel.value;

        const mobile =
            document
                .getElementById("mobile")
                .value
                .trim();

        const description =
            desc.value.trim();

        const photoInput =
            document.getElementById("photo");

        const photo =
            photoInput.files[0];


        /* Validate brand */

        if (!brand) {

            return msg(
                "Please select your car brand.",
                false
            );

        }


        /* Validate model */

        if (!model) {

            return msg(
                "Please select your car model.",
                false
            );

        }


        /* Validate service */

        if (!service) {

            return msg(
                "Please select a service.",
                false
            );

        }


        /* Validate mobile */

        if (!/^[6-9]\d{9}$/.test(mobile)) {

            return msg(
                "Please enter a valid 10-digit Indian mobile number.",
                false
            );

        }


        /* Validate description */

        if (!description) {

            return msg(
                "Please describe the damage.",
                false
            );

        }


        const sendButton =
            document.getElementById("send");

        sendButton.disabled = true;

        sendButton.textContent =
            "Sending...";


        try {

            /*
             * Keep the backend field name carModel.
             *
             * It will now contain:
             *
             * Maruti Suzuki - WagonR
             */

            const selectedCar =
                brand + " - " + model;


            const formData =
                new FormData();

            formData.append(
                "carModel",
                selectedCar
            );

            formData.append(
                "serviceType",
                service
            );

            formData.append(
                "mobileNumber",
                mobile
            );

            formData.append(
                "description",
                description
            );


            /*
             * Keep photo filename behavior
             * compatible with your current backend.
             *
             * Actual photo upload can be added later.
             */

            if (photo) {

                formData.append(
                    "photoName",
                    photo.name
                );

            }


            /*
             * IMPORTANT:
             *
             * Do NOT set Content-Type manually.
             *
             * Browser automatically sets multipart/form-data
             * with the required boundary.
             */

            const response =
                await fetch(
                    "/api/queries",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Unable to submit enquiry"
                );

            }


            msg(
                "✓ Enquiry submitted successfully. We will contact you soon.",
                true
            );


            /* Reset form */

            carBrand.value = "";

            carModel.innerHTML =
                '<option value="">First choose car brand</option>';

            carModel.disabled = true;

            document
                .getElementById("mobile")
                .value = "";

            desc.value = "";

            photoInput.value = "";

            cnt.textContent = "0";


            document
                .querySelectorAll(".service")
                .forEach(function (x) {
                    x.classList.remove("active");
                });

            service = "";


        } catch (e) {

            msg(
                e.message,
                false
            );

        } finally {

            sendButton.disabled = false;

            sendButton.textContent =
                "Send Enquiry";

        }

    };
