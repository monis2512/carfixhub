services:
  - type: web
    name: shahrukh-auto-care-admin
    runtime: docker
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: shahrukh-auto-care-admin-db
          property: host

      - key: DATABASE_PORT
        value: "5432"

      - key: DATABASE_NAME
        fromDatabase:
          name: shahrukh-auto-care-admin-db
          property: database

      - key: DATABASE_USERNAME
        fromDatabase:
          name: shahrukh-auto-care-admin-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: shahrukh-auto-care-admin-db
          property: password

      - key: DATABASE_DRIVER
        value: org.postgresql.Driver

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: shahrukh-auto-care-admin-db
    plan: free
    databaseName: autocare_admin
    user: autocare_admin
